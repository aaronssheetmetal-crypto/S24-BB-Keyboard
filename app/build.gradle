plugins { id 'com.android.application' }

android {
    namespace 'com.pressco.s24bbkeyboard'
    compileSdk 35
    defaultConfig {
        applicationId 'com.pressco.s24bbkeyboard'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '2.0.0'
    }
    buildTypes {
        release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
}
